[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=2.3.0",
    "ipython>=9.17.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.3",
    "torch>=2.14.1",
    "typer>=0.27.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpt"]

[tool.ruff]
src = ["."]

[project.scripts]
llm = "gpt.main:cli"
